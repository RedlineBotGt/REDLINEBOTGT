
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>WEBLINE GT</title>

    <meta property="og:title" content="WEBLINE GT">
    <meta property="og:description" content="Portal oficial de WEBLINE GT">

    <link
        rel="icon"
        type="image/png"
        href="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png"
    >

    <link
        rel="apple-touch-icon"
        href="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png"
    >

    <!-- ESTILOS -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/event.css">
    <link rel="stylesheet" href="/css/menu.css">
</head>

<body>

    <!-- =====================================
         CABECERA
         ===================================== -->

    <header class="topbar">
        <img
            src="https://cdn.discordapp.com/attachments/1483247050429567087/1567853761039171584/Photoroom-20260710_235454839.png?ex=6aedb119&is=6aec5f99&hm=c239078f547f0dd24a49dc0cb33f6ac6860311c4c7a16fdfe918393afcd5cb7d&"
            alt="WEBLINE GT"
        >
    </header>


    <!-- =====================================
         CONTENIDO PRINCIPAL
         ===================================== -->

    <main class="main">

        <h1 class="page-title">EVENTO</h1>

        <div id="event-container">
            <div class="message">
                Cargando evento...
            </div>
        </div>

    </main>


    <!-- =====================================
         PIE DE PÁGINA
         ===================================== -->

    <footer class="footer">
        WEBLINE GT
    </footer>


    <!-- =====================================
         FONDO PARA CERRAR EL MENÚ
         ===================================== -->

    <div
        id="menu-backdrop"
        class="menu-backdrop"
        aria-hidden="true">
    </div>


    <!-- =====================================
         MENÚ FLOTANTE
         ===================================== -->

    <aside id="floating-menu" class="floating-menu">

        <nav
            id="menu-panel"
            class="menu-panel"
            aria-label="Menú principal"
            aria-hidden="true"
        >

            <button
                type="button"
                class="menu-button active"
            >
                🏁 EVENTO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                📜 REGLAMENTO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                ℹ️ INFO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                🏆 CLASIFICACIÓN
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                💬 CHAT
            </button>


            <!-- CERRAR SESIÓN -->

            <form
                action="/auth/logout"
                method="POST"
                class="menu-logout-form"
            >

                <button
                    type="submit"
                    class="menu-logout"
                >
                    🚪 CERRAR SESIÓN
                </button>

            </form>

        </nav>


        <!-- BOTÓN REDONDO DEL MENÚ -->

        <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="menu-panel"
        >

            <img
                src="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png"
                alt="Menú WEBLINE GT"
            >

        </button>

    </aside>


    <!-- =====================================
         JAVASCRIPT PRINCIPAL
         ===================================== -->

    <script type="module" src="/js/main.js"></script>

</body>
</html>
