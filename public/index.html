<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>WEBLINE GT</title>

    <meta property="og:title" content="WEBLINE GT">
    <meta property="og:description" content="Plataforma oficial de REDLINE GT">
    <meta property="og:image" content="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png">

    <link rel="icon" href="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png">
    <link rel="apple-touch-icon" href="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png">

    <style>
        :root {
            --bg: #080808;
            --panel: #151515;
            --panel2: #202020;
            --border: #303030;
            --text: #f5f5f5;
            --muted: #999;
            --red: #d71920;
            --green: #168a45;
            --blue: #2369bd;
            --orange: #bd781b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        button {
            font: inherit;
        }

        .topbar {
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 90px 12px 15px;
            border-bottom: 1px solid var(--border);
            background: #050505;
        }

        .topbar img {
            display: block;
            max-width: 260px;
            max-height: 58px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 76px;
            height: 100vh;
            background: #101010;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 6px;
            gap: 12px;
            z-index: 10;
        }

        .round-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--red);
            margin-bottom: 12px;
        }

        .menu-button {
            width: 62px;
            min-height: 58px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: default;
            padding: 5px 2px;
        }

        .menu-button.active {
            color: white;
            background: #292929;
            border-color: var(--red);
        }

        .menu-icon {
            font-size: 21px;
        }

        .menu-label {
            font-size: 10px;
            font-weight: bold;
        }

        .logout {
            margin-top: auto;
            width: 62px;
            min-height: 45px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #202020;
            color: #ddd;
            cursor: pointer;
            font-size: 11px;
        }

        .main {
            width: calc(100% - 76px);
            max-width: 1100px;
            margin: 0 auto;
            padding: 22px;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0 20px;
        }

        .event-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .event-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .event-tag {
            display: inline-block;
            color: #fff;
            background: var(--red);
            border-radius: 4px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .event-title {
            font-size: 25px;
            font-weight: bold;
            margin: 0 0 12px;
            overflow-wrap: anywhere;
        }

        .event-meta {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        .event-description {
            padding: 18px 20px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #ddd;
        }

        .event-image {
            display: none;
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            background: #050505;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .event-content {
            padding: 20px;
        }

        .section-heading {
            font-size: 17px;
            margin: 0 0 14px;
        }

        .rsvp-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .rsvp-button {
            min-height: 48px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            background: #292929;
            opacity: 0.45;
            cursor: not-allowed;
        }

        .rsvp-button.yes {
            background: #155b32;
        }

        .rsvp-button.reserve {
            background: #75500e;
        }

        .rsvp-button.maybe {
            background: #174c80;
        }

        .rsvp-button.no {
            background: #762222;
        }

        .rsvp-button.available {
            opacity: 1;
            cursor: pointer;
            border-color: #aaa;
        }

        .rsvp-button.available:hover {
            filter: brightness(1.2);
        }

        .rsvp-note {
            color: var(--muted);
            font-size: 12px;
            margin: 0 0 24px;
            line-height: 1.5;
        }

        .lists-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .list-card {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow: hidden;
        }

        .list-title {
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
        }

        .list-title.yes {
            border-left: 4px solid var(--green);
        }

        .list-title.reserve {
            border-left: 4px solid var(--orange);
        }

        .list-title.maybe {
            border-left: 4px solid var(--blue);
        }

        .list-title.no {
            border-left: 4px solid var(--red);
        }

        .list-body {
            padding: 12px;
            min-height: 48px;
            font-size: 12px;
            color: #ddd;
        }

        .pilot {
            padding: 7px 0;
            border-bottom: 1px solid #383838;
            overflow-wrap: anywhere;
        }

        .pilot:last-child {
            border-bottom: 0;
        }

        .empty-list {
            color: var(--muted);
            font-style: italic;
        }

        .message {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 25px 18px;
            text-align: center;
            color: var(--muted);
            line-height: 1.6;
        }

        .message.error {
            border-color: #792929;
            color: #ffb0b0;
        }

        .footer {
            color: #666;
            text-align: center;
            font-size: 11px;
            padding: 25px 10px;
        }

        @media (min-width: 850px) {
            .sidebar {
                width: 220px;
                align-items: stretch;
                padding: 22px 14px;
            }

            .round-logo {
                width: 105px;
                height: 105px;
                margin: 0 auto 25px;
            }

            .menu-button {
                width: 100%;
                min-height: 48px;
                flex-direction: row;
                justify-content: flex-start;
                gap: 13px;
                padding: 10px 14px;
            }

            .menu-icon {
                width: 25px;
                text-align: center;
            }

            .menu-label {
                font-size: 13px;
            }

            .logout {
                width: 100%;
                min-height: 42px;
            }

            .main {
                width: calc(100% - 220px);
                padding: 30px;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                min-height: 72px;
                padding-right: 82px;
            }

            .topbar img {
                max-width: 190px;
                max-height: 48px;
            }

            .main {
                padding: 16px 12px;
            }

            .page-title {
                font-size: 21px;
            }

            .event-header {
                padding: 16px;
            }

            .event-title {
                font-size: 21px;
            }

            .event-content {
                padding: 14px;
            }

            .lists-grid {
                grid-template-columns: 1fr;
            }

            .rsvp-button {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <img
            src="https://cdn.discordapp.com/attachments/1483247050429567087/1567540249570185236/1793749060837.png"
            alt="REDLINE GT"
        >
    </header>

    <aside class="sidebar">
        <img
            class="round-logo"
            src="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png"
            alt="REDLINE GT"
        >

        <button class="menu-button active" type="button">
            <span class="menu-icon">🏁</span>
            <span class="menu-label">EVENTO</span>
        </button>

        <button class="menu-button" type="button" disabled>
            <span class="menu-icon">📜</span>
            <span class="menu-label">REGLAMENTO</span>
        </button>

        <button class="menu-button" type="button" disabled>
            <span class="menu-icon">ℹ️</span>
            <span class="menu-label">INFO</span>
        </button>

        <button class="menu-button" type="button" disabled>
            <span class="menu-icon">🏆</span>
            <span class="menu-label">CLASIFICACIÓN</span>
        </button>

        <button class="menu-button" type="button" disabled>
            <span class="menu-icon">💬</span>
            <span class="menu-label">CHAT</span>
        </button>

        <form action="/auth/logout" method="POST" style="margin-top:auto;width:100%;">
            <button class="logout" type="submit">Cerrar sesión</button>
        </form>
    </aside>

    <main class="main">
        <h1 class="page-title">EVENTO</h1>

        <div id="event-container">
            <div class="message">
                Cargando evento de REDLINE GT...
            </div>
        </div>

        <div class="footer">
            REDLINE GT · WEBLINEGT
        </div>
    </main>

    <script>
        const eventContainer = document.getElementById("event-container");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return entities[character];
            });
        }

        function formatDate(value) {
            if (!value) return "Fecha pendiente";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return "Fecha no disponible";
            }

            return new Intl.DateTimeFormat("es-ES", {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                timeZone: "Europe/Madrid"
            }).format(date);
        }

        function renderPilotList(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return '<div class="empty-list">Ningún piloto todavía</div>';
            }

            return items.map(id => {
                const safeId = escapeHTML(id);
                return `<div class="pilot">Discord: ${safeId}</div>`;
            }).join("");
        }

        function renderList(title, items, type) {
            const count = Array.isArray(items) ? items.length : 0;

            return `
                <section class="list-card">
                    <div class="list-title ${type}">
                        ${title} (${count})
                    </div>
                    <div class="list-body">
                        ${renderPilotList(items)}
                    </div>
                </section>
            `;
        }

        function renderEvent(event, permisos) {
            const rsvps = event.rsvps || {};

            const puedeSerTitular = permisos?.puedeSerTitular === true;
            const puedeSerReserva = permisos?.puedeSerReserva === true;

            const imageHTML = event.image
                ? `<img class="event-image" id="event-image" src="${escapeHTML(event.image)}" alt="Imagen del evento">`
                : "";

            let permisoMensaje = "";

            if (puedeSerTitular) {
                permisoMensaje = "Tu rol de Discord te permite seleccionar TITULAR.";
            } else if (puedeSerReserva) {
                permisoMensaje = "Tu rol de Discord te permite seleccionar RESERVA.";
            } else if (permisos?.esTitular && permisos?.esReserva) {
                permisoMensaje = "Tienes los roles de titular y reserva. El bot deberá validar tu respuesta.";
            } else {
                permisoMensaje = "Tu usuario no tiene actualmente un rol de titular o reserva.";
            }

            eventContainer.innerHTML = `
                <article class="event-card">

                    <header class="event-header">
                        <span class="event-tag">EVENTO ACTUAL</span>

                        <h2 class="event-title">
                            ${escapeHTML(event.title || "Evento REDLINE GT")}
                        </h2>

                        <div class="event-meta">
                            📅 ${escapeHTML(formatDate(event.scheduledAt))}<br>
                            📢 ${escapeHTML(event.channelName || "Canal de eventos")}
                        </div>
                    </header>

                    ${imageHTML}

                    <div class="event-description">
                        ${escapeHTML(event.description || "Sin descripción adicional.")}
                    </div>

                    <div class="event-content">

                        <h3 class="section-heading">CONFIRMA TU ASISTENCIA</h3>

                        <div class="rsvp-buttons">
                            <button
                                class="rsvp-button yes ${puedeSerTitular ? "available" : ""}"
                                type="button"
                                ${puedeSerTitular ? "" : "disabled"}
                            >
                                ✅ TITULAR
                            </button>

                            <button
                                class="rsvp-button reserve ${puedeSerReserva ? "available" : ""}"
                                type="button"
                                ${puedeSerReserva ? "" : "disabled"}
                            >
                                🔃 RESERVA
                            </button>

                            <button class="rsvp-button maybe" type="button" disabled>
                                ❔ DUDA
                            </button>

                            <button class="rsvp-button no" type="button" disabled>
                                ❌ NO PUEDO
                            </button>
                        </div>

                        <p class="rsvp-note">
                            ${escapeHTML(permisoMensaje)}
                            Los botones se conectarán al sistema de asistencia de Discord en el siguiente paso.
                        </p>

                        <h3 class="section-heading">LISTA DE PARTICIPANTES</h3>

                        <div class="lists-grid">
                            ${renderList("✅ TITULARES", rsvps.yes, "yes")}
                            ${renderList("🔃 RESERVAS", rsvps.reserve, "reserve")}
                            ${renderList("❔ DUDAS", rsvps.maybe, "maybe")}
                            ${renderList("❌ NO PUEDEN", rsvps.no, "no")}
                        </div>

                    </div>
                </article>
            `;

            const image = document.getElementById("event-image");

            if (image) {
                image.addEventListener("error", () => {
                    image.style.display = "none";
                });

                image.addEventListener("load", () => {
                    image.style.display = "block";
                });
            }
        }

        async function loadEvent() {
            try {
                const response = await fetch("/api/evento", {
                    method: "GET",
                    credentials: "same-origin",
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    window.location.href = "/";
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        "El servidor ha respondido con error " + response.status
                    );
                }

                const data = await response.json();

                if (!data.activo || !data.evento) {
                    eventContainer.innerHTML = `
                        <div class="message">
                            No hay ningún evento publicado actualmente.
                            <br>
                            Cuando REDLINE GT publique el próximo evento,
                            aparecerá aquí automáticamente.
                        </div>
                    `;
                    return;
                }

                renderEvent(data.evento, data.permisos || {});

            } catch (error) {
                console.error("Error cargando el evento:", error);

                eventContainer.innerHTML = `
                    <div class="message error">
                        No se ha podido cargar el evento.
                        <br>
                        Comprueba la conexión con el servidor e inténtalo de nuevo.
                    </div>
                `;
            }
        }

        loadEvent();
    </script>

</body>
</html>
