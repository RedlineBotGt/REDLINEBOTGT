<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Academia Campos: aprender juntos, crecer juntos.">
  <title>Academia Campos</title>
  <link rel="stylesheet" href="/styles.css?v=2">
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>Academia Campos</h1>
      <p>Aprender juntos, crecer juntos</p>
    </header>

    <section
      id="profiles-screen"
      class="screen"
      aria-labelledby="profiles-title"
    >
      <h2 id="profiles-title">¿Quién va a aprender hoy?</h2>

      <div class="profiles">
        <button type="button" class="profile-card"
          onclick="seleccionarPerfil('leo')">
          <span aria-hidden="true">🙇</span>
          <strong>Leo</strong>
        </button>

        <button type="button" class="profile-card"
          onclick="seleccionarPerfil('papa')">
          <span aria-hidden="true">🧔</span>
          <strong>Papá</strong>
        </button>

        <button type="button" class="profile-card"
          onclick="seleccionarPerfil('mama')">
          <span aria-hidden="true">👩🏾</span>
          <strong>Mamá</strong>
        </button>
      </div>
    </section>

    <section
      id="subjects-screen"
      class="screen hidden"
      aria-labelledby="subjects-title"
    >
      <h2 id="subjects-title">
        ¡Hola, <span id="profile-name"></span>!
      </h2>

      <button
        type="button"
        class="subject-card"
        style="min-height: auto; padding: 10px 16px; margin-bottom: 15px;"
        onclick="volverPerfiles()"
      >
        ← Cambiar de perfil
      </button>

      <p>Elige una asignatura para empezar.</p>

      <div class="subjects">
        <button type="button" class="subject-card"
          onclick="abrirAsignatura('lateral')">
          🧠 Cultura general
        </button>

        <button type="button" class="subject-card"
          onclick="abrirAsignatura('matematicas')">
          ➗ Matemáticas
        </button>

        <button type="button" class="subject-card"
          onclick="abrirAsignatura('geografia')">
          🌍 Geografía
        </button>
      </div>
    </section>

    <section
      id="challenge-screen"
      class="screen hidden"
      aria-labelledby="challenge-title"
    >
      <button type="button" onclick="volverAsignaturas()">
        ← Volver
      </button>

      <h2 id="challenge-title">Reto</h2>

      <p id="challenge-prompt" aria-live="polite">
        Preparando pregunta...
      </p>

      <label for="user-answer">Tu respuesta</label>

      <textarea
        id="user-answer"
        rows="3"
        placeholder="Escribe tu respuesta..."
        autocomplete="off"
      ></textarea>

      <div class="challenge-actions">
        <button type="button" id="send-btn"
          onclick="enviarRespuesta()" disabled>
          Comprobar respuesta
        </button>

        <button type="button" id="hint-btn"
          onclick="mostrarPista()">
          💡 Pedir una pista
        </button>

        <button type="button" id="next-btn"
          onclick="siguientePregunta()">
          Siguiente pregunta →
        </button>
      </div>

      <div id="ai-feedback" aria-live="polite" role="status"></div>
    </section>

  </main>

  <script src="/app.js" defer></script>
</body>
</html>
