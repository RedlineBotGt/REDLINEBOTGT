
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>WEBLINE GT</title>

    <meta property="og:title" content="WEBLINE GT">
    <meta property="og:description" content="Portal oficial de WEBLINE GT">

    <!-- ICONO CIRCULAR -->
    <link
        rel="icon"
        href="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110545"
    >

    <link
        rel="apple-touch-icon"
        href="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110545"
    >

    <!-- ESTILOS -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/event.css">
    <link rel="stylesheet" href="/css/menu.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="topbar">
        <img
            src="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110577"
            alt="WEBLINE GT"
        >
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main">

        <h1 class="page-title">EVENTO</h1>

        <div id="event-container">
            <div class="message">
                Cargando evento...
            </div>
        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        WEBLINE GT
    </footer>

    <!-- FONDO PARA CERRAR EL MENÚ -->
    <div
        id="menu-backdrop"
        class="menu-backdrop"
        aria-hidden="true">
    </div>

    <!-- MENÚ FLOTANTE -->
    <aside id="floating-menu" class="floating-menu">

        <nav
            id="menu-panel"
            class="menu-panel"
            aria-label="Menú principal"
            aria-hidden="true"
        >

            <button
                type="button"
                class="menu-button active"
            >
                🏁 EVENTO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                📜 REGLAMENTO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                ℹ️ INFO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                🏆 CLASIFICACIÓN
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                💬 CHAT
            </button>

            <!-- CERRAR SESIÓN -->
            <form
                action="/auth/logout"
                method="POST"
                class="menu-logout-form"
            >

                <button
                    type="submit"
                    class="menu-logout"
                >
                    🚪 CERRAR SESIÓN
                </button>

            </form>

        </nav>

        <!-- BOTÓN REDONDO DEL MENÚ -->
        <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="menu-panel"
        >

            <img
                src="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110545"
                alt="Menú WEBLINE GT"
            >

        </button>

    </aside>

    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="/js/main.js"></script>

</body>
</html>
