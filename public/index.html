
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>WEBLINE GT</title>

    <meta property="og:title" content="WEBLINE GT">
    <meta property="og:description" content="Plataforma oficial de REDLINE GT">

    <link rel="icon" href="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png">
    <link rel="apple-touch-icon" href="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/event.css">
    <link rel="stylesheet" href="/css/menu.css">
</head>

<body>

    <!-- ==================================
         CABECERA
         ================================== -->

    <header class="topbar">
        <img
            id="horizontal-logo"
            src="https://cdn.discordapp.com/attachments/1483247050429567087/1567540249570185236/1793749060837.png?ex=6aec8d1e&is=6aeb3b9e&hm=0d3fc3d7d05583c986903390e2840148333771bdd0fa7060e6d36168edb2afd5&"
            alt="REDLINE GT"
        >
    </header>


    <!-- ==================================
         CONTENIDO PRINCIPAL
         ================================== -->

    <main class="main">

        <h1 class="page-title">EVENTO</h1>

        <div id="event-container">
            <div class="message">
                Cargando evento de REDLINE GT...
            </div>
        </div>

        <div class="footer">
            REDLINE GT · WEBLINEGT
        </div>

    </main>


    <!-- ==================================
         FONDO PARA CERRAR EL MENÚ
         ================================== -->

    <div
        id="menu-backdrop"
        class="menu-backdrop"
        aria-hidden="true"
    ></div>


    <!-- ==================================
         MENÚ FLOTANTE
         ================================== -->

    <aside
        id="floating-menu"
        class="floating-menu"
    >

        <!-- PANEL DESPLEGABLE -->

        <nav
            id="menu-panel"
            class="menu-panel"
            aria-label="Menú principal"
            aria-hidden="true"
        >

            <button
                class="menu-button active"
                type="button"
                aria-current="page"
            >
                <span class="menu-icon">🏁</span>
                <span class="menu-label">EVENTO</span>
            </button>

            <button
                class="menu-button"
                type="button"
                disabled
            >
                <span class="menu-icon">📜</span>
                <span class="menu-label">REGLAMENTO</span>
            </button>

            <button
                class="menu-button"
                type="button"
                disabled
            >
                <span class="menu-icon">ℹ️</span>
                <span class="menu-label">INFO</span>
            </button>

            <button
                class="menu-button"
                type="button"
                disabled
            >
                <span class="menu-icon">🏆</span>
                <span class="menu-label">CLASIFICACIÓN</span>
            </button>

            <button
                class="menu-button"
                type="button"
                disabled
            >
                <span class="menu-icon">💬</span>
                <span class="menu-label">CHAT</span>
            </button>

            <form
                action="/auth/logout"
                method="POST"
                class="menu-logout-form"
            >
                <button
                    class="menu-logout"
                    type="submit"
                >
                    Cerrar sesión
                </button>
            </form>

        </nav>


        <!-- BOTÓN CIRCULAR -->

        <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="menu-panel"
        >
            <img
                id="round-logo"
                src="https://cdn.discordapp.com/attachments/1483247050429567087/1567540257740558366/1793749060837_1.png?ex=6aec8d20&is=6aeb3ba0&hm=8ffcbff5f8c9750e76cbe6b07d4d57392cd52bbbfdbd0b9eb2d0e24b08473d88&"
                alt="Abrir menú REDLINE GT"
            >
        </button>

    </aside>


    <!-- ==================================
         JAVASCRIPT PRINCIPAL
         ================================== -->

    <script
        type="module"
        src="/js/main.js"
    ></script>

</body>
</html>
