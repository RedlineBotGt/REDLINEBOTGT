
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>WEBLINE GT</title>

    <meta property="og:title" content="WEBLINE GT">
    <meta property="og:description" content="Portal oficial de WEBLINE GT">

    <link rel="icon" href="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110545">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110545">

    <link rel="manifest" href="/manifest.json">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/event.css">
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="topbar">
        <img
            src="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110577"
            alt="WEBLINE GT"
        >
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main">

        <!-- APARTADO EVENTO -->
        <section id="event-section">
            <h1 class="page-title">EVENTO</h1>

            <div id="event-container">
                <div class="message">
                    Cargando evento...
                </div>
            </div>
        </section>

        <!-- APARTADO CHAT -->
        <section id="chat-section" hidden>
            <h1 class="page-title">CHAT</h1>

            <div class="chat-container">

                <div class="chat-header">
                    <div class="chat-header-title">
                        💬 CHAT WEBLINE GT
                    </div>

                    <div class="chat-status">
                        Conectando
                    </div>
                </div>

                <div
                    id="chat-messages"
                    class="chat-messages"
                    aria-live="polite"
                >
                    <div class="chat-loading">
                        Cargando mensajes...
                    </div>
                </div>

                <div class="chat-input-area">

                    <div
                        id="chat-mentions-list"
                        class="chat-mentions-list"
                        hidden
                    ></div>

                    <div class="chat-input-wrapper">

                        <textarea
                            id="chat-input"
                            class="chat-input"
                            placeholder="Escribe un mensaje..."
                            rows="1"
                            maxlength="2000"
                        ></textarea>

                        <button
                            id="chat-send"
                            class="chat-send-button"
                            type="button"
                            aria-label="Enviar mensaje"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        WEBLINE GT
    </footer>

    <!-- FONDO PARA CERRAR EL MENÚ -->
    <div
        id="menu-backdrop"
        class="menu-backdrop"
        aria-hidden="true"
    ></div>

    <!-- MENÚ FLOTANTE -->
    <aside id="floating-menu" class="floating-menu">

        <nav
            id="menu-panel"
            class="menu-panel"
            aria-label="Menú principal"
            aria-hidden="true"
        >

            <button
                type="button"
                class="menu-button active"
                data-section="event"
            >
                🏁 EVENTO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                📜 REGLAMENTO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                ℹ️ INFO
            </button>

            <button
                type="button"
                class="menu-button"
                disabled
            >
                🏆 CLASIFICACIÓN
            </button>

            <button
                type="button"
                class="menu-button"
                data-section="chat"
            >
                💬 CHAT
            </button>

            <form
                action="/auth/logout"
                method="POST"
                class="menu-logout-form"
            >
                <button
                    type="submit"
                    class="menu-logout"
                >
                    🚪 CERRAR SESIÓN
                </button>
            </form>

        </nav>

        <!-- BOTÓN REDONDO DEL MENÚ -->
        <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="menu-panel"
        >
            <img
                src="https://res.cloudinary.com/iir4vyqc/image/upload/f_auto,q_auto/1000110545"
                alt="Menú WEBLINE GT"
            >
        </button>

    </aside>

    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="/js/main.js"></script>

</body>
</html>
