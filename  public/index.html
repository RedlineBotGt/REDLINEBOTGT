<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Academia Campos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>Academia Campos</h1>
      <p>Aprender juntos, crecer juntos</p>
    </header>

    <section id="profiles-screen" class="screen">
      <h2>¿Quién va a jugar hoy?</h2>

      <div class="profiles">
        <button class="profile-card" onclick="seleccionarPerfil('leo')">
          <span>🧒</span>
          <strong>Leo</strong>
        </button>

        <button class="profile-card" onclick="seleccionarPerfil('papa')">
          <span>👨</span>
          <strong>Papá</strong>
        </button>

        <button class="profile-card" onclick="seleccionarPerfil('mama')">
          <span>👩</span>
          <strong>Mamá</strong>
        </button>
      </div>
    </section>

    <section id="subjects-screen" class="screen hidden">
      <h2>¡Hola, <span id="profile-name"></span>!</h2>
      <p>Elige una asignatura para empezar.</p>

      <div class="subjects">
        <button class="subject-card" onclick="abrirAsignatura('lateral')">
          🧠 Cultura general
        </button>

        <button class="subject-card" onclick="abrirAsignatura('matematicas')">
          ➗ Matemáticas
        </button>

        <button class="subject-card" onclick="abrirAsignatura('geografia')">
          🌍 Geografía
        </button>
      </div>
    </section>

    <section id="challenge-screen" class="screen hidden">
      <button onclick="volverAsignaturas()">← Volver</button>

      <h2 id="challenge-title">Reto</h2>
      <p id="challenge-prompt">Preparando pregunta...</p>

      <textarea id="user-answer" placeholder="Escribe tu respuesta..."></textarea>

      <button id="send-btn" onclick="enviarRespuesta()">
        Comprobar respuesta
      </button>

      <div id="ai-feedback"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
